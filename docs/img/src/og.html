<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>loadout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* 1280x640 social banner. */
.word { font-size: 26px; } .word svg { width: 23px; height: 23px; }
.wrap { display: grid; grid-template-rows: auto 1fr; padding: 40px 56px; }
.hero { display: grid; justify-items: center; align-content: center; gap: 22px; text-align: center; padding-bottom: 36px; }
h1 { margin: 0; font: 400 104px/1 var(--font-display); letter-spacing: -0.028em; }
p { margin: 0; font-size: 24px; line-height: 1.4; color: var(--ink-2); max-width: 34ch; text-wrap: balance; }
.install { margin-top: 10px; display: inline-flex; gap: 12px; background: var(--cta); color: var(--cta-ink); border-radius: 10px; padding: 16px 22px; font: 400 20px/1 var(--font-mono); }
.install em { font-style: normal; opacity: 0.55; }
</style>
</head>
<body>
<canvas id="trails" aria-hidden="true"></canvas>
<div class="wrap">
  <span class="word"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 14 C6 14, 6 4, 10 4 S 14 10, 16 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="2" cy="14" r="1.8" fill="currentColor"/><circle cx="16" cy="10" r="1.8" fill="currentColor"/></svg>loadout</span>
  <div class="hero">
    <h1>Work the way they work.</h1>
    <p>Load one developer's Claude Code workflow into your own session.</p>
    <div class="install"><em>&gt;</em>/loadout:use ./maya.loadout</div>
  </div>
</div>
<script src="trails.js"></script>
<script>drawTrails(7, 14, 0.55);</script>
</body>
</html>
